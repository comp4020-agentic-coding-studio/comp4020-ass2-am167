<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Noon, and the receipt for it</title>
  <desc id="desc">A clock reading twelve on a dark board, an upload receipt stamped beside it, and a short column of the standing studio rules — the deadline, the extension and the authorship line — set out to its right.</desc>
  <rect width="1600" height="620" fill="#17150f"/>
  <g stroke="#3a3427" stroke-width="2">
    <path d="M0 110h1600M0 250h1600M0 390h1600M0 530h1600M200 0v620M400 0v620M600 0v620M800 0v620M1000 0v620M1200 0v620M1400 0v620"/>
  </g>
  <g transform="rotate(-5 560 310)">
    <rect x="420" y="188" width="280" height="252" fill="#e7d7ad"/>
    <g stroke="#17150f" stroke-width="7">
      <path d="M452 238h216M452 274h216M452 310h150M452 346h216M452 382h120"/>
    </g>
    <g transform="rotate(-12 600 400)">
      <rect x="512" y="368" width="184" height="62" fill="none" stroke="#b45436" stroke-width="7"/>
      <text x="528" y="410" fill="#b45436" font-family="monospace" font-size="27" letter-spacing="2">LODGED</text>
    </g>
  </g>
  <circle cx="800" cy="310" r="124" fill="#241f15" stroke="#e7d7ad" stroke-width="7"/>
  <g stroke="#4d442f" stroke-width="7" stroke-linecap="round">
    <path d="M800 202v20M800 398v20M692 310h20M888 310h20"/>
  </g>
  <path d="M800 310V214" stroke="#c69f57" stroke-width="11" stroke-linecap="round"/>
  <path d="M800 310v-70" stroke="#b45436" stroke-width="14" stroke-linecap="round"/>
  <circle cx="800" cy="310" r="13" fill="#c69f57"/>
  <text x="800" y="402" fill="#c69f57" font-family="monospace" font-size="22" letter-spacing="4" text-anchor="middle">12:00</text>
  <g transform="translate(1000 194)">
    <g fill="#c69f57"><rect width="26" height="26"/><rect y="76" width="26" height="26"/><rect y="152" width="26" height="26"/></g>
    <g fill="#e7d7ad">
      <rect x="52" y="8" width="330" height="11"/><rect x="52" y="34" width="240" height="11"/>
      <rect x="52" y="84" width="300" height="11"/><rect x="52" y="110" width="200" height="11"/>
      <rect x="52" y="160" width="342" height="11"/><rect x="52" y="186" width="262" height="11"/>
    </g>
  </g>
</svg>
