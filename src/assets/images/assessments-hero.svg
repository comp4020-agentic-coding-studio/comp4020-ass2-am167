<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Three assessed scales</title>
  <desc id="desc">Three frames nested inside one another on a dark board — one neighbourhood cell inside a district inside the whole city — with the corridor running through all three and the three marks reading twenty-five, twenty-five and fifty per cent.</desc>
  <rect width="1600" height="620" fill="#17150f"/>
  <g stroke="#3a3427" stroke-width="2">
    <path d="M0 110h1600M0 250h1600M0 390h1600M0 530h1600M200 0v620M400 0v620M600 0v620M800 0v620M1000 0v620M1200 0v620M1400 0v620"/>
  </g>
  <rect x="180" y="130" width="1240" height="360" fill="#1e1a12"/>
  <g stroke="#3a3427" stroke-width="8" stroke-linecap="square">
    <path d="M180 230h1240M180 390h1240M420 130v360M680 130v360M940 130v360M1180 130v360"/>
  </g>
  <g fill="#2b2619">
    <rect x="210" y="152" width="180" height="62"/><rect x="1210" y="152" width="180" height="62"/>
    <rect x="210" y="410" width="180" height="62"/><rect x="1210" y="410" width="180" height="62"/>
  </g>
  <rect x="180" y="130" width="1240" height="360" fill="none" stroke="#e7d7ad" stroke-width="5"/>
  <path d="M180 466c260-52 380 40 620 4s360-96 620-52" fill="none" stroke="#b45436" stroke-width="13"/>
  <rect x="500" y="196" width="600" height="228" fill="#241f15" stroke="#e7d7ad" stroke-width="5"/>
  <g stroke="#4d442f" stroke-width="13" stroke-linecap="square">
    <path d="M500 310h600M700 196v228M900 196v228"/>
  </g>
  <g fill="#e7d7ad">
    <rect x="528" y="216" width="146" height="76"/><rect x="926" y="216" width="146" height="76"/>
    <rect x="528" y="330" width="146" height="72"/><rect x="926" y="330" width="146" height="72"/>
  </g>
  <rect x="716" y="256" width="168" height="108" fill="#c69f57"/>
  <path d="M742 310h52m-26-26v52" stroke="#17150f" stroke-width="10" fill="none"/>
  <path d="M818 292h48M818 330h48" stroke="#17150f" stroke-width="9"/>
