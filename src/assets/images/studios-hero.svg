  <g stroke="#3a3427" stroke-width="2">
    <path d="M0 110h1600M0 250h1600M0 390h1600M0 530h1600M240 0v620M480 0v620M720 0v620M960 0v620M1200 0v620M1440 0v620"/>
  </g>
