<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">The studio pin-up wall</title>
  <desc id="desc">A plan sheet pinned to a dark studio wall with a critic's rust arrow drawn across it, flanked by two more pinned sheets, and a card reading the same route before the week's decision and six weeks after it.</desc>
