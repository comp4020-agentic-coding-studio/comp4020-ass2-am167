    <rect x="150" y="176" width="290" height="268" fill="#241f15" stroke="#4d442f" stroke-width="4"/>
    <g stroke="#4d442f" stroke-width="12"><path d="M150 310h290M295 176v268"/></g>
    <g fill="#e7d7ad">
      <rect x="180" y="204" width="86" height="76"/><rect x="324" y="204" width="86" height="76"/>
      <rect x="180" y="340" width="86" height="76"/><rect x="324" y="340" width="86" height="76"/>
    </g>
    <circle cx="295" cy="192" r="11" fill="#c69f57"/>
  </g>
  <g transform="rotate(-2 1300 310)">
