    <text x="22" y="42" fill="#e7d7ad" font-family="monospace" font-size="17" letter-spacing="2">PEAK ROUTE</text>
    <text x="22" y="94" fill="#c69f57" font-family="monospace" font-size="28">11.2</text>
    <text x="22" y="124" fill="#e7d7ad" font-family="monospace" font-size="16">BEFORE</text>
    <path d="M22 150h144" stroke="#b45436" stroke-width="7"/>
