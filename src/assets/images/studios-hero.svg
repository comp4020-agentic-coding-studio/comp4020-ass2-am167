    <g stroke="#4d442f" stroke-width="12"><path d="M1160 310h290"/></g>
    <g fill="#c69f57">
      <rect x="1190" y="204" width="110" height="86"/><rect x="1320" y="204" width="100" height="86"/>
    </g>
    <g fill="#e7d7ad">
      <rect x="1190" y="336" width="110" height="86"/><rect x="1320" y="336" width="100" height="86"/>
    </g>
    <circle cx="1305" cy="192" r="11" fill="#c69f57"/>
  </g>
  <g transform="rotate(2 800 310)">
    <rect x="510" y="150" width="400" height="326" fill="#241f15" stroke="#e7d7ad" stroke-width="5"/>
    <g stroke="#4d442f" stroke-width="18" stroke-linecap="square">
      <path d="M510 262h400M510 372h400M680 150v326"/>
    </g>
    <g fill="#e7d7ad">
      <rect x="540" y="176" width="106" height="70"/><rect x="714" y="176" width="164" height="70"/>
      <rect x="540" y="288" width="106" height="66"/><rect x="714" y="288" width="164" height="66"/>
      <rect x="540" y="392" width="106" height="60"/><rect x="714" y="392" width="164" height="60"/>
